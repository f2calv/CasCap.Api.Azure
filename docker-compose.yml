# Default: docker compose up -d --wait starts the local Azurite test dependency.
# Endpoints: Blob localhost:10000; Queue localhost:10001; Table localhost:10002.
# Emulator state is disposable and kept outside the working tree in a named volume.
services:

  #https://github.com/azure/azurite
  azurite:
    # Upstream publishes no :3 major alias; retain this verified release tag.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    volumes:
      - azurite_data:/data
    ports:
      - 127.0.0.1:10000:10000
      - 127.0.0.1:10001:10001
      - 127.0.0.1:10002:10002
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          Promise.all([10000, 10001, 10002].map(port => new Promise((resolve, reject) => {
            const socket = require('net').connect(port, '127.0.0.1', () => { socket.end(); resolve(); });
            socket.on('error', reject);
          }))).then(() => process.exit(0), () => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  azurite_data:
